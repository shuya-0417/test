name: Post to X

on:
  schedule:
    # 1日5回、JSTの08:00 / 11:30 / 15:00 / 18:30 / 21:30 に実行（UTC表記）。
    - cron: "0 23 * * *"   # 08:00 JST
    - cron: "30 2 * * *"   # 11:30 JST
    - cron: "0 6 * * *"    # 15:00 JST
    - cron: "30 9 * * *"   # 18:30 JST
    - cron: "30 12 * * *"  # 21:30 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post next item in queue
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_to_x.py

      - name: Record queue/posted-log changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.jsonl content/posted.jsonl
          git diff --cached --quiet || git commit -m "chore: record posted X content"
          git push
