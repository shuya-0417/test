name: Surface X draft

on:
  schedule:
    # 1日5回、JSTの08:00 / 11:30 / 15:00 / 18:30 / 21:30 に実行（UTC表記）。
    - cron: "0 23 * * *"   # 08:00 JST
    - cron: "30 2 * * *"   # 11:30 JST
    - cron: "0 6 * * *"    # 15:00 JST
    - cron: "30 9 * * *"   # 18:30 JST
    - cron: "30 12 * * *"  # 21:30 JST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: surface-x-draft
  cancel-in-progress: false

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Open an issue with the next queued post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/surface_next_post.py

      - name: Record queue/delivered-log changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.jsonl content/delivered.jsonl
          git diff --cached --quiet || git commit -m "chore: record delivered X draft"
          git push
